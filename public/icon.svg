  <path d="M 155 220 L 256 160 L 357 220 C 370 228 375 245 365 255 L 147 255 C 137 245 142 228 155 220 Z" fill="none" stroke="#70D0F5" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>

